server:
  port: ${PORT:${SERVER_PORT:8761}}
  shutdown: graceful

spring:
  application:
    name: service-registry
  cloud:
    inetutils:
      use-only-site-local-interfaces: false

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_IP:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# Configuration for the First Eureka Server (Peer 1)
spring:
  config:
    activate:
      on-profile: peer1
server:
  port: ${PORT:${SERVER_PORT:8761}}
eureka:
  instance:
    hostname: peer1
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: ${EUREKA_PEER2_URL:http://localhost:8762/eureka/}

---
# Configuration for the Second Eureka Server (Peer 2)
spring:
  config:
    activate:
      on-profile: peer2
server:
  port: ${PORT:${SERVER_PORT:8762}}
eureka:
  instance:
    hostname: peer2
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: ${EUREKA_PEER1_URL:http://localhost:8761/eureka/}
