server:
  port: 8761 #(Eureka) | 8761 (Standard Eureka port)

spring:
  application:
    name: service-registry
  cloud:
    inetutils:
      use-only-site-local-interfaces: false

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

    
---
# Configuration for the First Eureka Server (Peer 1)
spring:
  config:
    activate:
      on-profile: peer1
server:
  port: 8761
eureka:
  instance:
    hostname: peer1
    prefer-ip-address: false
  client:
  # Peer 1 registers itself with Peer 2
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://localhost:8762/eureka/

---
# Configuration for the Second Eureka Server (Peer 2)
spring:
  config:
    activate:
      on-profile: peer2
server:
  port: 8762
eureka:
  instance:
    hostname: peer2
    prefer-ip-address: false
    # Peer 2 registers itself with Peer 1
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/    