server:
  port: ${PORT:${SERVER_PORT:8084}}
  shutdown: graceful

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key_value: ${JWT_SECRET_KEY:SagarWorkspaceSskSecretKeyForPolyglotSaasErpWorkspaceSskSecretKeyForSskSecretKeyForPolyglotSaasErpWorkspace_1@}

resilience4j:
  circuitbreaker:
    instances:
      inventoryServiceBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        minimumNumberOfCalls: 2
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - feign.FeignException
          - java.lang.RuntimeException
  retry:
    instances:
      orderRetry:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - feign.FeignException
          - java.io.IOException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
