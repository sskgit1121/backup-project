server:
  port: ${PORT:${SERVER_PORT:8888}}
  shutdown: graceful

spring:
  application:
    name: config-server

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
