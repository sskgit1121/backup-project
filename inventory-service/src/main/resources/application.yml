
server:
  port: 8086

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    #Optimize your connection pool settings
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000  

  jpa:
    open-in-view: false # FIX: This must be directly under jpa to turn off OSIV:        #release connections immediately after the service layer completes
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
   

  security:
    oauth2:
      resourceserver:
        jwt:
          # Point issuer directly to auth-service base url
          issuer-uri: http://localhost:8081
          # Point directly to your newly created local public certs endpoint
          jwk-set-uri: http://localhost:8081/api/v1/auth/certs
          secret-key: ${JWT_SECRET_KEY}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
---

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ssk.inventory.dto"
    

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

