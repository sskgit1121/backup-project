server:
  port: ${PORT:${SERVER_PORT:8083}}
  shutdown: graceful

spring:
  application:
    name: product-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/product_db}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET_KEY:SagarWorkspaceSskSecretKeyForPolyglotSaasErpSagarWorkspaceSskSecretKeyForPolyglotSaasErp1_@}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
