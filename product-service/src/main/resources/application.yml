server:
  port: 8083

spring:
  application:
    name: product-service
  
  # 🔌 MongoDB Connection URI (Creates 'product_db' automatically on first insert)
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_db

# Keep your existing eureka server defaults zone configurations here...  
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/,http://localhost:8762/eureka/      #mult server instances for this prj  