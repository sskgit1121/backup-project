server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      locator:
        enabled: true
        lower-case-service-id: true
      filter:
        request-rate-limiter:
          deny-empty-key: true
      
      routes:
        # 1. Route to Order Service
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeyResolver}"

        # 2. Route to Product Service
        - id: product-service-route
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

        # 3. Route to Inventory Service
        - id: inventory-service-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/erp/inventory/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeyResolver}"

        # 4. Route to Customer Service
        - id: customer-service-route
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**

        # 5. Route to Payment Service
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        # 6. Route to Auth Service
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
