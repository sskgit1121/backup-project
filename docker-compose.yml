version: '3.8'

services:
  # ================= Backing Services =================
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ================= Core Infrastructure Services =================
  service-registry:
    build:
      context: .
      args:
        SERVICE_NAME: service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_IP: service-registry

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
    container_name: config-server
    depends_on:
      - service-registry
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    depends_on:
      - service-registry
      - redis
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin1234}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_ISSUER_URI: http://auth-service:8081

  product-service:
    build:
      context: .
      args:
        SERVICE_NAME: product-service
    container_name: product-service
    depends_on:
      - mongodb
      - service-registry
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      MONGODB_URI: mongodb://mongodb:27017/product_db
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin1234}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/

  inventory-service:
    build:
      context: .
      args:
        SERVICE_NAME: inventory-service
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin1234}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/api/v1/auth/certs

volumes:
  postgres_data:
  mongo_data:
